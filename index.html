.h9 .lgb.off i{background:var(--ctrl)}
.h9 .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;border:0;border-radius:0;overflow:visible}
.h9 .wd{border:1px solid var(--line2);border-radius:14px;background:var(--surface-2);min-height:140px;display:flex;flex-direction:column;overflow:hidden}
.h9 .wd.past{opacity:.72}
.h9 .wd.today{background:#fff;border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(31,47,132,.07)}
.h9 .wd-h{display:flex;align-items:baseline;justify-content:space-between;padding:9px 11px 6px;border:0;background:transparent}
.h9 .wd-h span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.h9 .wd-h b{font:800 19px var(--f-disp);color:var(--ink)}
.h9 .wd.today .wd-h b{color:#fff;background:var(--navy);border-radius:8px;padding:0 8px}
.h9 .wd-l{display:flex;flex-direction:column;gap:5px;padding:0 7px 9px}
.h9 .we{display:flex;flex-direction:column;text-align:left;border:0;border-radius:9px;background:#fff;padding:6px 8px;box-shadow:inset 3px 0 0 var(--c),0 1px 2px rgba(16,24,40,.06);min-width:0}
.h9 .we b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h9 .we span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h9 .we:hover{background:var(--surface-3)}
.h9 .wd-l .none{color:var(--faint);text-align:center;padding-top:10px}
.h9 .wd-l .more{font-size:11.5px;color:var(--navy);font-weight:600;padding:0 6px}
.h9 .qi-top{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:end;margin:26px 0 18px}
.h9 .qi-big b{display:block;font:800 46px/1 var(--f-disp);letter-spacing:-.04em;color:var(--navy)}
.h9 .qi-big span{display:block;font-size:13px;color:var(--ink2);margin-top:4px}
.h9 .qi-big em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:8px}
.h9 .bars{display:grid;gap:8px;height:140px;align-items:end}
.h9 .bar{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
.h9 .bv{width:100%;max-width:38px;min-height:3px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#8A78F0,#3346B0);position:relative}
.h9 .bv i{position:absolute;top:-19px;left:0;right:0;text-align:center;font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink2)}
.h9 .bar em{font-style:normal;font-size:11px;color:var(--muted);text-transform:capitalize}
.h9 .qis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.h9 .qi{border:1px solid var(--line2);border-radius:14px;padding:12px 14px;background:var(--surface-2);position:relative;overflow:hidden}
.h9 .qi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--faint)}
.h9 .qi.ok::before{background:var(--ok)}.h9 .qi.warn::before{background:var(--warn)}.h9 .qi.due::before{background:var(--due)}
.h9 .qi-l{display:block;font-size:12px;color:var(--ink2);min-height:32px;line-height:1.35}
.h9 .qi b{display:block;font:800 23px var(--f-disp);letter-spacing:-.02em;margin-top:4px}
.h9 .qi b.nd{font:600 13.5px var(--f);color:var(--faint);margin-top:10px}
.h9 .qi.ok b{color:var(--ok)}.h9 .qi.warn b{color:var(--warn)}.h9 .qi.due b{color:var(--due)}
.h9 .qi em{font-style:normal;font-size:11.5px;color:var(--muted)}
.h9 .qi-bar{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.h9 .qi-bar span{display:block;height:100%;background:currentColor;border-radius:4px}
.h9 .qi.ok .qi-bar{color:var(--ok)}.h9 .qi.warn .qi-bar{color:var(--warn)}.h9 .qi.due .qi-bar{color:var(--due)}
.h9 .qnote{font-size:12px;color:var(--muted);margin-top:12px}
.h9 .rs{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;text-align:left;border:1px solid var(--line2);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.h9 .rs:hover{border-color:var(--accent-line);background:#fff}
.h9 .rs b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h9 .rs .mono{font-size:11px;color:var(--muted)}
.h9 .rs-p span{font-size:12px;font-weight:600;color:var(--ink2)}
.h9 .pbar{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;margin-top:5px}
.h9 .pbar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3346B0,#6B55D6)}
.h9 .mini-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.h9 .mini-k>div{border:1px solid var(--line2);background:var(--surface-2);border-radius:12px;padding:9px 11px}
.h9 .mini-k b{display:block;font:800 21px var(--f-disp);color:var(--ink)}
.h9 .mini-k span{font-size:11.5px;color:var(--muted)}
.h9 .plist{display:flex;flex-direction:column;gap:2px}
.h9 .pli{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 6px}
.h9 .pli:hover{background:var(--surface-2)}
.h9 .pli b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h9 .pli div span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h9 .pk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--navy)}
.h9 .pk.talk{background:#E6F4F3;color:#0E7F7A}
.h9 .gdot{width:10px;height:10px;border-radius:50%;background:var(--faint);justify-self:center}
.h9 .gdot.due{background:var(--due)}.h9 .gdot.warn{background:var(--warn)}.h9 .gdot.ok{background:var(--ok)}
.h9 .gprog{margin-bottom:10px}
.h9 .gprog b{font:800 21px var(--f-disp)}.h9 .gprog span{font-size:12px;color:var(--muted)}
.h9 .pact{display:flex;gap:6px;margin-top:auto;padding-top:10px}
@media (max-width:1400px){.aip-open .h9 .kpis.home{grid-template-columns:repeat(3,minmax(0,1fr))}.aip-open .h9 .dash{grid-template-columns:1fr}.aip-open .h9 .bgrid{grid-template-columns:1fr}.aip-open .h9 .wk{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1180px){.h9 .kpis.home{grid-template-columns:repeat(3,minmax(0,1fr))}.h9 .dash{grid-template-columns:1fr 1fr}.h9 .bgrid{grid-template-columns:1fr}.h9 .wk{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.h9 .bi-s{margin-left:52px}.h9 .hero{margin:12px 12px 0;min-height:300px}.h9 .hero-in{padding:22px 20px 50px}.h9 .hero h1{font-size:27px}.h9 .hero-k span{display:none}.h9 .kpis.home{padding:0 12px;grid-template-columns:1fr 1fr}.h9 .dash{padding:14px 12px 0;grid-template-columns:1fr}.h9 .wk{grid-template-columns:1fr}.h9 .wd{min-height:0}.h9 .qi-top{grid-template-columns:1fr}.h9 .legend{margin-left:0!important}}
.h9 .bsum{display:grid;gap:10px;padding:2px 0 16px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.h9 .sl{display:flex;gap:10px;align-items:flex-start}
.h9 .sl-ic{color:var(--faint);margin-top:2px;flex:none}
.h9 .sl-b{min-width:0;flex:1}
.h9 .sl-t{font-size:13.5px;line-height:1.45;color:var(--ink2)}

.h9 .bchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.h9 .bchip{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer;text-align:left}
.h9 .bchip:hover{border-color:var(--accent-line);background:var(--accent-soft)}

@media (max-width:760px){.h9 .bchip span{max-width:150px}}

/* mobile: page must not pan sideways */

/*V12-START: NROC-style redesign (remove this block + v12 JS to roll back)*/
:root{--bg:#F6F8F9;--surface:#FFFFFF;--surface-2:#FAFBFC;--surface-3:#F0F2F5;--hover:#F3F5F8;--ink:#151515;--ink2:#3A3F4B;--muted:#6B7280;--faint:#9CA3AF;--line:#E2E5EA;--line2:#EDF0F3;--navy:#1F2F84;--navy-d:#17246A;--navy-l:#2F43A8;--accent:#1F2F84;--accent-ink:#1F2F84;--accent-soft:#EEF1FA;--accent-line:#C9D0EE;--r:4px;--r-s:3px;--r-l:6px;--sh1:0 1px 2px rgba(17,24,39,.04);--sh2:0 4px 14px rgba(17,24,39,.06);--sh3:0 18px 44px rgba(17,24,39,.14),0 2px 6px rgba(17,24,39,.05)}
body{font-size:14px;color:var(--ink)}

.qf-g{font-size:11px;font-weight:600;color:#888;padding:6px 14px 2px;text-transform:uppercase}
.qf-it{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 14px}
.qf-it b{display:block;font-size:13.5px;font-weight:600;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qf-it span{font-size:12px;color:#666}
.qf-it.on,.qf-it:hover{background:#3875d7}
.qf-it.on b,.qf-it.on span,.qf-it:hover b,.qf-it:hover span{color:#fff}
.qf-none{padding:12px 14px;color:#777}
.qf-hint{font-size:11.5px;color:#999;padding:6px 14px;border-top:1px solid #f2f2f2}
/* papers */
.paperw{padding:0 28px 28px}
.pp-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pp-list{display:flex;gap:6px;flex-wrap:wrap}
.pp-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pp-title{flex:1 1 100%;min-width:260px;font-size:20px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:6px 10px;background:transparent}
.pp-title:hover,.pp-title:focus{border-color:var(--line);background:#fff}
.pp-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pp-body{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;gap:14px;align-items:start}
.pp-nav{position:sticky;top:8px;display:flex;flex-direction:column;gap:1px}
.pp-nav button{display:flex;align-items:center;gap:6px;border:0;background:transparent;text-align:left;padding:5px 8px;border-left:2px solid var(--line);font-size:12.5px;color:var(--ink2)}
.pp-nav button span{flex:1}
.pp-nav button em{font-style:normal;font-size:11px;color:var(--faint,#999)}
.pp-nav button:hover{border-left-color:var(--navy);background:#fff}
.pp-nav .add{color:var(--navy);border-left-color:transparent;margin-top:6px}
.pp-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.pp-sec{padding:12px 16px 16px}
.pp-sec.editing{box-shadow:0 0 0 2px var(--navy,#1f2f84)}
.pp-sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.pp-st{font-size:15px;font-weight:600;border:1px solid transparent;border-radius:4px;padding:3px 6px;background:transparent;min-width:120px;flex:1 1 260px}
.pp-st:hover:not([readonly]),.pp-st:focus{border-color:var(--line)}
.pp-sa{margin-left:auto;display:flex;gap:6px;align-items:center}
.pp-ed{width:100%;min-height:180px;font:15px/1.65 Georgia,"Times New Roman",serif;border:1px solid var(--line);border-radius:6px;padding:12px 14px;resize:vertical}
.pp-txt,.pp-read{font:15px/1.65 Georgia,"Times New Roman",serif;color:var(--ink)}
.pp-txt p{margin:0 0 .7em}
.cite{color:#1f5bb8;white-space:nowrap}
.pp-refs{margin:0;padding-left:22px;font-size:13.5px;line-height:1.5}
.pp-refs li{margin-bottom:4px}
.pp-refs.apa{list-style:none;padding-left:0}
.pp-refs.apa li{padding-left:22px;text-indent:-22px}
.pp-read{background:#fff;border:1px solid var(--line);border-radius:8px;padding:34px min(60px,5vw)}
.pp-read h1{font-size:22px;text-align:center;margin-bottom:18px}
.pp-read h2{font-size:16px;margin:18px 0 6px}
.pp-hist{margin-top:10px;padding:10px;background:var(--surface-2,#f6f7fa);border-radius:6px;display:grid;gap:6px;font-size:13px}
.ph-r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pp-notes{position:sticky;top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:calc(100vh - 120px);overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.pn-top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.pn-top b{display:inline-flex;gap:6px;align-items:center}
.seg.sm button{padding:3px 8px;font-size:12px}
.cm-new{border:1px solid var(--navy,#1f2f84);border-radius:6px;padding:8px;display:grid;gap:6px}
.cm-new textarea{width:100%}
.cm{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;display:grid;gap:4px}
.cm.tome{border-color:#d49a1a;background:#fffaf0}
.cm.done{opacity:.6}
.cm-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cm-sec{border:0;background:transparent;padding:0;text-align:left;color:var(--navy,#1f2f84);font-size:12px}
.cm blockquote,.cm-new blockquote{margin:0;border-left:3px solid #e2c16b;padding:2px 8px;color:#555;font-style:italic;font-size:12.5px}
.cm p{margin:0}
.cm-rep{border-top:1px dashed var(--line);padding-top:4px}
.cm-a{display:flex;gap:6px;align-items:center}
.cm-a input{flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:12.5px}
@media (max-width:1300px){.pp-body{grid-template-columns:minmax(0,1fr) 300px}.pp-nav{display:none}}
@media (max-width:900px){.paperw{padding:0 12px 16px}.pp-body{grid-template-columns:1fr}.pp-notes{position:static;max-height:none}}
/*V12-END*/

.mpcard.over{outline:2px dashed var(--navy);outline-offset:-4px;background:rgba(80,110,255,.05)}.mp-drop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}.mp-hint{font-size:12px;color:var(--faint,#9aa1ad);align-self:center}

/* ===== редактор с форматированием, заметки в тексте, рукописи, Zotero ===== */
.rt-tb{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:5px 6px;margin:0 0 -1px;border:1px solid var(--line);border-radius:6px 6px 0 0;background:var(--surface-2,#f6f7fa)}
.rtb{min-width:30px;height:30px;padding:0 7px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink);font:13.5px/1 inherit;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.rtb:hover{background:var(--surface,#fff);border-color:var(--line)}
.rtb.wtxt{font-size:12.5px;font-weight:500}
.rt-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.rt-hl{background:#fff3a3;color:#1a1a1a;padding:0 3px;border-radius:2px}.rt-hl.off{background:transparent;text-decoration:line-through;color:inherit}
.rt-dd{position:relative;display:inline-flex}
.rt-sym{position:absolute;top:34px;left:0;z-index:20;display:grid;grid-template-columns:repeat(7,32px);gap:2px;padding:6px;background:var(--surface,#fff);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh3,0 8px 24px rgba(0,0,0,.15))}
.rt-sym[hidden]{display:none}
.pp-ed[contenteditable]{min-height:200px;border-radius:0 0 6px 6px;outline:none;overflow-wrap:anywhere;background:var(--surface,#fff)}
.pp-ed[contenteditable]:focus{border-color:var(--navy)}
.pp-ed[contenteditable]:empty:before{content:attr(data-ph);color:var(--faint,#999);font-style:italic}
.rt-view{font:15px/1.65 Georgia,"Times New Roman",serif;color:var(--ink)}
.rt-view p{margin:0 0 .7em}.rt-view h2{font-size:18px;margin:.9em 0 .4em;font-weight:700}.rt-view h3{font-size:16px;margin:.8em 0 .35em;font-weight:700;font-style:italic}.rt-view h4{font-size:15px;margin:.7em 0 .3em}
.rt-view ul,.rt-view ol{margin:0 0 .7em;padding-left:26px}.rt-view li{margin:.15em 0}
.rt-view blockquote{margin:.4em 0 .8em;padding:4px 14px;border-left:3px solid var(--line);color:var(--ink2,#444);font-style:italic}
.rt-view table{border-collapse:collapse;width:100%;margin:.4em 0 .9em;font-size:14px;line-height:1.45}
.rt-view td,.rt-view th{border:1px solid var(--line);padding:5px 8px;vertical-align:top;text-align:left;min-width:40px}
.rt-view th{background:var(--surface-2,#f4f5f8);font-weight:600}
.rt-view mark{background:#fff3a3;color:#1a1a1a;padding:0 1px}
.rt-view a{color:var(--navy);text-decoration:underline}
.rt-view hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.rt-view sup,.rt-view sub{font-size:.75em}
mark.cmk{background:rgba(255,210,60,.45);color:inherit;border-bottom:2px solid #e0a800;cursor:pointer;padding:0;border-radius:2px}
mark.cmk.sug{background:rgba(220,60,60,.12);border-bottom:2px dashed #c0392b}
mark.cmk.on,mark.cmk:hover{background:rgba(255,190,0,.75)}
mark.cmk.sug.on,mark.cmk.sug:hover{background:rgba(220,60,60,.28)}
.cm.focus{box-shadow:0 0 0 2px #e0a800}
.cm-q{display:block;width:100%;text-align:left;border:0;border-left:3px solid #e0a800;background:rgba(255,210,60,.15);padding:4px 8px;margin:4px 0 6px;font:italic 12.5px/1.45 inherit;color:var(--ink2,#444);cursor:pointer;border-radius:0 4px 4px 0}
.cm.sug{border-left:3px solid #c0392b}
.sug-b{display:flex;flex-direction:column;gap:3px;margin:4px 0 6px;font-size:13px}
.sug-old{border:0;background:rgba(220,60,60,.1);text-decoration:line-through;text-align:left;padding:3px 6px;border-radius:4px;color:inherit;cursor:pointer;font:inherit}
.sug-new{background:rgba(18,183,106,.12);padding:3px 6px;border-radius:4px}
.cm-kind{margin:6px 0}
.selpop{position:fixed;z-index:120;display:flex;gap:4px;padding:4px;background:#1f2433;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.selpop[hidden]{display:none}
.selpop button{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:#fff;font-size:12.5px;padding:5px 9px;border-radius:5px;cursor:pointer}
.selpop button:hover{background:rgba(255,255,255,.14)}
.pp-pres{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}.pp-pres em{font-style:normal;margin-left:4px}
.wr-bar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:0 0 14px}
.wr-sel{display:flex;flex-direction:column;gap:3px;min-width:min(420px,100%)}.wr-sel span{font-size:12px;color:var(--muted)}
.wr-bar .tabs em{font-style:normal;font-size:11.5px;color:var(--muted)}
.zotbtn{gap:5px;width:auto!important;padding:0 8px}.zotbtn span{font-size:12.5px}
.zot-steps{margin:8px 0 12px;padding-left:20px;line-height:1.6}
.zot-acts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 8px}
.zot-msg{margin:8px 0;padding:8px 10px;border-radius:6px;background:var(--surface-2,#f4f5f8);font-size:13px}
.cite-ed{display:inline-block;padding:0 4px;margin:0 1px;border-radius:4px;background:var(--accent-soft,#e8ecff);color:var(--navy);font:12.5px/1.6 system-ui,sans-serif;cursor:default;user-select:all}
@media (max-width:640px){.rt-tb{top:0}.rtb{min-width:28px;height:28px;padding:0 5px}.wr-sel{min-width:100%}}

html[data-theme="dark"] .pp-notes,html[data-theme="dark"] .pp-read,html[data-theme="dark"] .qf,html[data-theme="dark"] .cmd{background:var(--surface-2);color:var(--ink)}
html[data-theme="dark"] .pp-title:hover,html[data-theme="dark"] .pp-title:focus,html[data-theme="dark"] .pp-nav button:hover,html[data-theme="dark"] .pnav button:hover{background:var(--hover)}
html[data-theme="dark"] .cm-q{background:rgba(255,210,60,.1);color:var(--ink2)}
html[data-theme="dark"] .cm p,html[data-theme="dark"] .cm b,html[data-theme="dark"] .pn-top b{color:var(--ink)}
html[data-theme="dark"] .zot,html[data-theme="dark"] .z-right,html[data-theme="dark"] .z-left,html[data-theme="dark"] .z-tb,html[data-theme="dark"] .z-search,html[data-theme="dark"] .z-items thead th{background:var(--surface-2);border-color:var(--line)}
html[data-theme="dark"] .z-search input{background:transparent;color:var(--ink)}
html[data-theme="dark"] .z-col{color:var(--ink2)}
html[data-theme="dark"] .z-col:hover{background:var(--hover)}
html[data-theme="dark"] .z-col.on{background:var(--accent-soft);color:var(--ink)}
html[data-theme="dark"] .z-col.dropon{background:var(--accent-line)}
html[data-theme="dark"] .z-tbtn:hover,html[data-theme="dark"] .z-tbtn.on{background:var(--surface-3);border-color:var(--line)}
html[data-theme="dark"] .z-f input:focus,html[data-theme="dark"] .z-f textarea:focus,html[data-theme="dark"] .z-f select:focus,html[data-theme="dark"] .z-sec>textarea:focus{background:var(--surface)}
html[data-theme="dark"] .mps.closed .mps-h,html[data-theme="dark"] .mps-n{background:var(--surface-2)}
html[data-theme="dark"] .sug-old{background:rgba(220,60,60,.18)}
html[data-theme="dark"] .sug-new{background:rgba(18,183,106,.18)}
html[data-theme="dark"] .rt-view mark,html[data-theme="dark"] .rt-hl{background:#8a7300;color:#fff}

/* ===== пакетная загрузка: группы по пациентам ===== */
.rg-sum{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 10px;font-size:13.5px}.rg-sum .btn{margin-left:auto}.rg-sum .due{color:var(--due)}
.rgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:12px}
.rg{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--line)}
.rg-strong{border-left-color:var(--ok,#12b76a)}.rg-weak{border-left-color:var(--warn,#f5a54a)}.rg-unk{border-left-color:var(--due,#e5484d)}.rg-saved{opacity:.75}
.rg-h{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}.rg-who{flex:1;min-width:180px;display:flex;flex-direction:column}.rg-who b{font-size:15px}.rg-who span{font-size:12.5px}
.rg-card{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}.rg-card select{max-width:100%}
.rg-warn{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}.rg-warn li{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--warn,#b54708);background:var(--warn-soft,#fff8eb);padding:4px 8px;border-radius:5px}
.rg-docs{width:100%;border-collapse:collapse;font-size:13px}.rg-docs td{padding:5px 4px;border-top:1px solid var(--line2);vertical-align:top}.rg-docs td:first-child svg{vertical-align:-2px;margin-right:5px;color:var(--muted)}
.rg-docs tr.weak td:first-child{background:var(--warn-soft,#fff8eb)}.rg-docs select{max-width:180px;font-size:12px}.rg-docs .btn{margin-left:4px}
.rg-f{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:2px}

/* «Нет информации» */
.f-na .na-v{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px dashed var(--line);border-radius:var(--r,4px);background:var(--surface-2);color:var(--muted);font-size:13px;font-style:italic}
.f-na .na-v .linkbtn{margin-left:auto;font-style:normal;font-size:12px}
.na-set{display:none;margin-top:4px;border:0;background:transparent;color:var(--navy);font-size:11.5px;padding:0;cursor:pointer;text-decoration:underline dotted}
.fld:focus-within .na-set{display:inline-block}

/* файлы пациента */
.pfiles.over{outline:2px dashed var(--navy);outline-offset:-4px}
.pfiles .filechip em{font-style:normal;font-size:11.5px;color:var(--muted);margin-left:4px}
.pfx{border:0;background:transparent;color:var(--muted);padding:2px;margin-left:2px;cursor:pointer;display:inline-flex;border-radius:4px}.pfx:hover{color:var(--due);background:var(--surface-3)}
.dxpf{display:flex;flex-direction:column;gap:4px;margin:10px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r,4px);background:var(--surface-2);max-height:220px;overflow:auto}
.dxpf>b{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:2px}.dxpf em{font-style:normal;font-size:11.5px;color:var(--muted)}

/* корзина файлов перед разбором */
.stage{margin:10px 0 12px;padding:12px;border:1px dashed var(--accent-line,#c9d0ee);border-radius:var(--r-l,6px);background:var(--accent-soft,#eef1fa)}
.stage-t{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}.stage-t b{display:flex;align-items:center;gap:6px}.stage-t span{font-size:12.5px;color:var(--muted)}
.stage-l{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}.stage-h{flex-basis:100%;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.stage-l .filechip{display:inline-flex;align-items:center;gap:5px;max-width:100%}.stage-l .fn{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage-l em{font-style:normal;font-size:11.5px;color:var(--muted)}

.mp-prog{display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px 12px;border-radius:var(--r-l,6px);background:var(--accent-soft,#eef1fa);font-size:13.5px}

/* шкалы анкет */
.qsc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.qsc.compact{margin:4px 0 0}
.qsc-i{display:inline-flex;align-items:baseline;gap:5px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:12.5px}
.qsc-i em{font-style:normal;color:var(--muted)}.qsc-i b{font-variant-numeric:tabular-nums}.qsc-i b i{font-style:normal;font-weight:400;color:var(--faint)}.qsc-i span{font-size:11.5px;color:var(--muted)}
.qsc-i.main{border-color:var(--accent-line,#c9d0ee)}.qsc-i.sc-ok{background:var(--ok-soft,#ecfdf3)}.qsc-i.sc-warn{background:var(--warn-soft,#fff8eb)}.qsc-i.sc-due{background:var(--due-soft,#fef3f2)}
.fill-done .qsc{justify-content:center;max-width:640px;margin:10px auto}
.tntq{padding:14px 16px}.tntt td{vertical-align:top}

/* стандарты: словарь, качество данных */
.ddq{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border-radius:50%;border:1px solid var(--line);font-size:10px;font-style:normal;font-weight:600;color:var(--muted);cursor:help;vertical-align:1px}
.ddq:hover{color:var(--accent);border-color:var(--accent)}
.fcode{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dqbox{margin:0 0 12px;border:1px solid #F5C26B;background:#FFF8EB;border-radius:10px;padding:2px 12px}.dqbox.err{border-color:#F3A29B;background:#FEF3F2}
.dq-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:8px 0;cursor:pointer;color:inherit;font:inherit;text-align:left}.dq-h b{flex:1;font-size:13px}
.dqbox ul,.dq-it ul{margin:0 0 8px;padding-left:18px;font-size:13px}.dqbox li.e,.dq-it li.e{color:#B42318}.dqbox li.w,.dq-it li.w{color:#93370D}
.sdvb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:13px}.sdvb.done{color:var(--muted)}.sdv-a{display:flex;gap:6px;margin-left:auto}
.dq-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.dq-k{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}.dq-k b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.dq-k span{font-size:12px;color:var(--muted)}.dq-k.ok b{color:#067647}.dq-k.bad b{color:#B42318}
.dq-bars{display:flex;flex-direction:column;gap:6px}.dq-row{display:grid;grid-template-columns:minmax(120px,240px) 1fr 120px;gap:10px;align-items:center;font-size:13px}
.dq-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dq-bar{display:flex;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}.dq-bar i{display:block;height:100%;background:#12B76A}.dq-bar i.na{background:#98A2B3}
.dq-v{font-variant-numeric:tabular-nums}.dq-v em{font-style:normal;color:var(--muted);font-size:11.5px}
.dq-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}.dq-it{border-top:1px solid var(--line);padding-top:8px}.dq-it.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dict-s{margin:0 0 10px}.dict-s input{width:100%;max-width:420px}
